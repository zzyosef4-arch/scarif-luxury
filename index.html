<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scarfi | Hijabs & Accessories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#100b10; --card:#1a1117; --line:#68432f;
  --gold:#f0cf91; --gold-d:#bd7540; --text:#fff3df; --muted:#c5aa91;
  --copper:#a94f2d; --amber:#e49a4c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(ellipse at 50% -18%,#48251f88 0%,transparent 52%),
  radial-gradient(ellipse at 100% 45%,#4a281522 0%,transparent 40%),
  var(--bg);color:var(--text);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7}
::selection{background:var(--gold);color:#1b1013}
.hero{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:66px 20px 48px;
  background:linear-gradient(145deg,#1b1018 0%,#130d12 52%,#24120f 100%)}
.hero::before{content:"";position:absolute;z-index:-1;left:-18%;right:-18%;top:-64%;height:165%;border-radius:50%;
  border:1px solid #d58a4b66;box-shadow:0 12px 55px -12px #e49a4c66,inset 0 -8px 28px -18px #f0cf91aa;
  opacity:.8;pointer-events:none;animation:arcGlow 7s ease-in-out infinite alternate}
.hero::after{content:"✦      ✧       ✦";position:absolute;z-index:-1;inset:12px 4% auto auto;
  color:#f0cf9166;font-size:clamp(18px,4vw,30px);letter-spacing:clamp(14px,5vw,48px);
  pointer-events:none;animation:starFloat 6s ease-in-out infinite}
@keyframes arcGlow{from{opacity:.45;filter:drop-shadow(0 0 2px #e49a4c)}to{opacity:.9;filter:drop-shadow(0 0 10px #e49a4c88)}}
@keyframes starFloat{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(7px);opacity:.9}}
.hero>*{position:relative;z-index:1}
.brand{font-family:"Playfair Display",serif;font-style:italic;font-weight:600;font-size:clamp(72px,22vw,150px);line-height:1.05;margin:0;direction:ltr;
  background:linear-gradient(105deg,#a95c32 8%,#f0cf91 32%,#fff3d7 48%,#d58b4a 64%,#f0cf91 82%,#a95c32 100%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;direction:ltr;
  font-family:"Cormorant Garamond",serif;font-size:clamp(18px,4.6vw,28px);color:var(--gold);font-weight:600}
.sub::before,.sub::after{content:"";height:1px;width:clamp(30px,12vw,110px);background:var(--gold-d)}
.lead{margin:18px auto 0;max-width:34ch;color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:12px 16px;background:rgba(11,10,9,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
button{font:inherit;cursor:pointer}
nav button{font-weight:500;color:var(--gold);background:linear-gradient(145deg,#21151b,#171016);
  border:1px solid #9c623e;border-radius:999px;padding:6px 20px;transition:all .28s ease}
nav button:hover{transform:translateY(-2px);background:#33201f;box-shadow:0 5px 18px #bd754033}
nav button[aria-pressed=true]{background:linear-gradient(135deg,#f4dba9,#d99b5d);color:#24131a;border-color:#f0cf91;box-shadow:0 3px 15px #d58a4b44}
button:focus-visible,input:focus-visible{outline:2px solid #fff1cf;outline-offset:2px}
main{max-width:1060px;margin:0 auto;padding:26px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{background:linear-gradient(155deg,#261821 0%,var(--card) 68%);border:1px solid var(--line);border-top:2px solid var(--gold-d);border-radius:10px;padding:18px 16px 16px;
  display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:0 10px 30px -18px #e49a4c66;
  opacity:0;transform:translateY(16px);animation:cardIn .7s cubic-bezier(.2,.7,.2,1) forwards;
  transition:transform .32s ease,box-shadow .32s ease,border-color .32s ease}
.item:hover{transform:translateY(-5px);box-shadow:0 16px 36px -18px #e49a4c99;border-color:#d18b55}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.item h3{margin:0;font-size:1.1rem;font-weight:700;color:var(--text)}
.item small{color:var(--muted)}
.pic{margin:-18px -16px 8px;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#bd754033,#160e14 78%)}
.pic svg{width:56%;height:auto}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s,filter .4s}.item:hover .pic img{transform:scale(1.045);filter:saturate(1.06)}
.panel .file{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.panel .file input{width:auto}
.price{margin-top:auto;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:1.7rem;color:var(--gold);line-height:1}
.price span{font-family:"Tajawal",sans-serif;font-size:.85rem;font-weight:400;color:var(--muted);margin-inline-start:4px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:4px 0;border-radius:4px;border:1px solid var(--gold-d);background:transparent;color:var(--gold);font-size:.9rem}
.row button.warn{border-color:#c9584a;color:#ff9d8f}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;padding:30px 16px 44px;border-top:1px solid #bd754066;color:var(--muted);
  background:linear-gradient(180deg,transparent,#1b101755)}
footer a{display:inline-block;margin-top:6px;color:var(--gold);font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.7rem;text-decoration:none;direction:ltr;letter-spacing:.04em}
#adminBar{margin-top:22px}
#editLink{margin-top:18px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 16px}
#langBtn{position:absolute;top:12px;inset-inline-end:14px;z-index:3;background:#1b1119cc;border:1px solid var(--gold-d);color:var(--gold);border-radius:999px;padding:4px 16px;font-weight:500;transition:all .25s}
#langBtn:hover{background:#39201f;box-shadow:0 4px 14px #bd754044}
#adminBar button,.panel button{border:1px solid var(--gold-d);background:transparent;color:var(--gold);border-radius:999px;padding:6px 20px}
.panel{max-width:1060px;margin:0 auto;padding:16px;background:#180f16;border:1px solid var(--gold-d);border-radius:10px;margin-block:16px}
.panel h2{margin:0 0 10px;font-size:1.1rem;color:var(--gold)}
.panel form{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.panel form{grid-template-columns:2fr 1.2fr 1fr auto}}
.panel input{width:100%;padding:10px;background:#100b10;color:var(--text);border:1px solid var(--line);border-radius:4px;font:inherit}
.panel .go{background:var(--gold);color:#120b0d;border-color:var(--gold);font-weight:700}
.panel .pub{margin-top:12px;background:var(--gold);color:#120b0d;border-color:var(--gold);font-weight:700}
.panel .pub[disabled]{opacity:.45;cursor:default}
.status{margin-top:8px;color:var(--muted);min-height:1.5em}
 .image-editor{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px;border:1px dashed var(--gold-d);border-radius:8px;background:#170f15}
.image-editor .preview{width:76px;height:92px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:#1b1711;display:none}
.image-editor .preview.visible{display:block}
.image-editor .image-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.image-editor .hint{display:block;color:var(--muted);font-size:.82rem}
.image-editor button{padding:5px 13px}
.hero .sub,.hero .lead{animation:heroUp .8s .12s both}
@keyframes heroUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hero .sub,.hero .lead{animation:heroUp .8s .18s both}
@keyframes heroUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
button{transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
/* Hide the product-management control on the public storefront. */
#editLink{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.item{opacity:1;transform:none}}

/* Scarfi signature motion */
.hero{padding-top:34px}
.brand-ornament{height:86px;position:relative;display:flex;justify-content:center;align-items:center;margin:0 auto -4px;max-width:420px}
.bow{width:106px;height:66px;filter:drop-shadow(0 4px 12px #d58a4b66);animation:bowFloat 4.8s ease-in-out infinite}
@keyframes bowFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.spark{position:absolute;color:#f4d99e;text-shadow:0 0 12px #e49a4c;animation:sparkPulse 3.4s ease-in-out infinite}
.spark-a{left:17%;top:26px;font-size:22px;animation-delay:.3s}
.spark-b{left:28%;top:2px;font-size:14px;animation-delay:1.1s}
.spark-c{right:17%;top:25px;font-size:20px;animation-delay:1.8s}
@keyframes sparkPulse{0%,100%{opacity:.35;transform:scale(.78) rotate(0)}50%{opacity:1;transform:scale(1.18) rotate(18deg)}}
.hero{background-size:200% 200%;animation:heroAtmosphere 18s ease infinite}
@keyframes heroAtmosphere{0%,100%{background-position:0% 40%}50%{background-position:100% 60%}}
.hero::after{content:"";inset:0;z-index:-1;letter-spacing:normal;background:linear-gradient(112deg,transparent 25%,#f4d99e0b 44%,#fff1d522 50%,#f4d99e0b 56%,transparent 74%);background-size:230% 100%;animation:lightSweep 9s ease-in-out infinite}
@keyframes lightSweep{0%,28%{background-position:130% 0}68%,100%{background-position:-130% 0}}
.brand{filter:drop-shadow(0 3px 16px #d58a4b22)}
.lead{max-width:39ch;line-height:2;font-size:1.02rem}
nav{background:rgba(16,11,16,.94);border-bottom-color:#bd754088}
.item{position:relative;overflow:hidden}
.item::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#fff1d20a 45%,transparent 68%);transform:translateX(-120%);transition:transform .8s ease}
.item:hover::before{transform:translateX(120%)}
.item h3{letter-spacing:.01em}
.price{ text-shadow:0 0 16px #d58a4b33}
footer{position:relative;overflow:hidden}
footer::before{content:"";display:block;width:min(170px,35vw);height:1px;margin:0 auto 20px;background:linear-gradient(90deg,transparent,#d58a4b,#f0cf91,#d58a4b,transparent);box-shadow:0 0 12px #d58a4b88}
.footer-kicker{font-family:"Cormorant Garamond",serif;letter-spacing:.22em;color:#bd895f;font-size:.8rem;margin-bottom:12px}
.address-wrap{margin:22px auto 0;padding:16px 18px;max-width:440px;border:1px solid #bd754066;border-radius:14px;background:linear-gradient(145deg,#251720aa,#120d12cc);box-shadow:inset 0 1px #fff1d20c,0 12px 28px #05030544}
.address-icon{display:block;color:var(--gold);font-size:1.6rem;line-height:1}
.address-title{color:var(--gold);font-weight:700;margin:5px 0}
.address-link{display:inline-block!important;margin:0!important;font-family:"Tajawal",sans-serif!important;font-size:1rem!important;line-height:1.9;letter-spacing:0!important;direction:rtl!important;color:#fff0d8!important;text-decoration:none}
.address-link:hover{color:var(--gold)!important}
.footer-note{margin-top:12px;font-size:.9rem;color:var(--muted)}
#editLink{margin-top:22px}
@media(prefers-reduced-motion:reduce){
  .bow,.spark,.hero,.hero::before,.hero::after,.brand{animation:none!important}
  .item::before{display:none}
}

</style>
</head>
<body>
<header class="hero">
  <button id="langBtn" class="lang" type="button"></button>
  <div class="brand-ornament" aria-hidden="true">
    <span class="spark spark-a">✦</span><span class="spark spark-b">✧</span>
    <svg class="bow" viewBox="0 0 140 82" role="presentation">
      <path d="M68 37C48 5 8 1 8 22c0 17 29 25 60 17M72 37C92 5 132 1 132 22c0 17-29 25-60 17" fill="url(#bowGold)" stroke="#f4d99e" stroke-width="2.5"/>
      <path d="M67 42L42 78l27-17 2-19M73 42l25 36-27-17-2-19" fill="url(#bowGold)" stroke="#e4b875" stroke-width="2"/>
      <rect x="62" y="30" width="16" height="22" rx="6" fill="#d99a56" stroke="#fff0c9" stroke-width="2"/>
      <defs><linearGradient id="bowGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0c9"/><stop offset=".48" stop-color="#d99550"/><stop offset="1" stop-color="#8f452e"/></linearGradient></defs>
    </svg>
    <span class="spark spark-c">✦</span>
  </div>
  <h1 class="brand" id="shopName"></h1>
  <div class="sub" id="tagline"></div>
  <p class="lead" id="lead"></p>
</header>
<nav id="filters" aria-label="الأقسام"></nav>
<div id="admin"></div>
<main><div class="grid" id="grid"></div></main>
<footer>
  <div class="footer-kicker">SCARFI · ELEGANCE IN EVERY DETAIL</div>
  <div id="footLabel"></div>
  <a id="phone"></a>
  <div class="address-wrap">
    <span class="address-icon" aria-hidden="true">⌖</span>
    <div class="address-title">زورونا في متجرنا</div>
    <a class="address-link" id="shopAddress" target="_blank" rel="noopener">11 عبد اللطيف حمزة أحمد فخري، مدينة نصر</a>
  </div>
  <div class="footer-note">يسعدنا استقبالكم واختيار ما يليق بأناقتكم</div>
  <div><button id="editLink" type="button">إدارة المنتجات</button></div>
  <div id="adminBar"></div>
</footer>

<script id="data" type="application/json">{"shop":{"name":"Scarfi","tagline":"Hijabs & Accessories","lead":"تشكيلة حجابات وإكسسوارات، تعالي شوفيها في المحل.","phone":"01143856388","footLabel":"للاستفسار والطلب"},"products":[{"name":"حجاب شيفون سادة","nameEn":"Plain chiffon hijab","cat":"حجابات","catEn":"Hijabs","price":"150"},{"name":"حجاب جيرسي","nameEn":"Jersey hijab","cat":"حجابات","catEn":"Hijabs","price":"120"},{"name":"إيشارب حرير","nameEn":"Silk scarf","cat":"حجابات","catEn":"Hijabs","price":"220"},{"name":"طرحة قطن","nameEn":"Cotton shawl","cat":"حجابات","catEn":"Hijabs","price":"95"},{"name":"توكة شعر ساتان","nameEn":"Satin hair clip","cat":"إكسسوارات","catEn":"Accessories","price":"35"},{"name":"بنسة حجاب (طقم)","nameEn":"Hijab pins (set)","cat":"إكسسوارات","catEn":"Accessories","price":"40"}]}</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA;
try { DATA = JSON.parse($("data").textContent); } catch(e) { DATA = {shop:{name:"Scarfi",tagline:"",lead:"",phone:"",footLabel:""},products:[]}; }
const S = DATA.shop;
let draft = DATA.products.map(p => ({...p}));
let formImg = "";
let current = "الكل", admin = false, art = null, editing = -1, armed = -1, dirty = false, busy = false;

$("shopName").textContent = S.name;
$("tagline").textContent = S.tagline;
const T = {
  ar:{lead:S.lead, foot:S.footLabel, all:"الكل", cur:"ج.م", empty:"مفيش منتجات في القسم ده دلوقتي.", nav:"الأقسام", edit:"تعديل المنتجات", other:"English"},
  en:{lead:"A collection of hijabs and accessories. Come see them at the shop.", foot:"For inquiries and orders", all:"All", cur:"EGP", empty:"No products in this section yet.", nav:"Sections", edit:"Edit products", other:"العربية"}
};
const nl = (navigator.languages && navigator.languages[0]) || navigator.language || "ar";
let lang = String(nl).toLowerCase().startsWith("ar") ? "ar" : "en";
function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("lead").textContent = T[lang].lead;
  $("footLabel").textContent = T[lang].foot;
  $("filters").setAttribute("aria-label", T[lang].nav);
  $("langBtn").textContent = T[lang].other;
  $("editLink").textContent = T[lang].edit;
  render();
}

$("phone").textContent = S.phone; $("phone").href = "tel:" + S.phone;
const shopAddress = "11 عبد اللطيف حمزة أحمد فخري، مدينة نصر";
$("shopAddress").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(shopAddress);

const nm = p => (lang === "en" && p.nameEn) ? p.nameEn : p.name;
const ct = p => (lang === "en" && p.catEn) ? p.catEn : p.cat;
const catLabel = c => { const p = draft.find(x => x.cat === c && x.catEn); return (lang === "en" && p) ? p.catEn : c; };
const PAL = ["#e6c07b","#b98a3e","#d9b27c","#c9a0a0","#8a6a3a","#f3e6cf"];
const imgSrc = v => /^[0-9a-f]{32}$/.test(v) ? "/_blob/" + v : v;
function pic(p,i){
  if(p.img) return `<img src="${esc(imgSrc(p.img))}" alt="${esc(p.name)}" loading="lazy">`;
  const c = PAL[i % PAL.length];
  if(/إكسس|access/i.test((p.cat||"") + (p.catEn||""))) return `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 58C34 26 8 40 14 66C20 90 46 76 60 64Z" fill="${c}"/><path d="M60 58C86 26 112 40 106 66C100 90 74 76 60 64Z" fill="${c}"/><path d="M60 62L40 104L56 96L60 106L64 96L80 104Z" fill="${c}" opacity=".8"/><rect x="50" y="50" width="20" height="22" rx="7" fill="${c}" stroke="#00000055"/></svg>`;
  return `<svg viewBox="0 0 120 150" aria-hidden="true"><path d="M60 22a6 6 0 1 1 6 6v5L110 60q7 5-3 7H13q-10-2-3-7L54 33" fill="none" stroke="#e6c07b" stroke-width="2.5" stroke-linecap="round"/><path d="M32 62q28 14 56 0l-7 76q-11 8-22 0l-3-48-9 48q-10 6-19-2z" fill="${c}"/><path d="M60 70l-3 20 3 45 8-2-4-60z" fill="#000" opacity=".2"/></svg>`;
}
async function shrink(file){
  if(!file || !file.type.startsWith("image/")) throw new Error("اختار ملف صورة صالح");
  let bitmap;
  try { bitmap = await createImageBitmap(file); }
  catch(e) {
    bitmap = await new Promise((resolve,reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("تعذر قراءة الصورة")); };
      img.src = url;
    });
  }
  const scale = Math.min(1, 1000 / Math.max(bitmap.width,bitmap.height));
  const cv = document.createElement("canvas");
  cv.width = Math.max(1,Math.round(bitmap.width*scale));
  cv.height = Math.max(1,Math.round(bitmap.height*scale));
  const ctx = cv.getContext("2d");
  if(!ctx) throw new Error("المتصفح لا يدعم تعديل الصور");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(bitmap,0,0,cv.width,cv.height);
  if(bitmap.close) bitmap.close();
  return await new Promise((resolve,reject) =>
    cv.toBlob(blob => blob ? resolve(blob) : reject(new Error("فشل ضغط الصورة")),"image/jpeg",0.82));
}

function render(){
  const cats = ["الكل", ...new Set(draft.map(p => p.cat).filter(Boolean))];
  if(!cats.includes(current)) current = "الكل";
  $("filters").innerHTML = cats.map(c => `<button type="button" aria-pressed="${c===current}" data-c="${esc(c)}">${esc(c==="الكل" ? T[lang].all : catLabel(c))}</button>`).join("");
  const rows = draft.map((p,i) => ({p,i})).filter(({p}) => current === "الكل" || p.cat === current);
  $("grid").innerHTML = rows.length ? rows.map(({p,i},n) => `
    <article class="item" style="animation-delay:${Math.min(n*75,450)}ms"><div class="pic">${pic(p,i)}</div><h3>${esc(nm(p))}</h3>${p.cat ? `<small>${esc(ct(p))}</small>` : ""}
    ${p.price ? `<div class="price">${esc(p.price)}<span>${T[lang].cur}</span></div>` : ""}
    ${admin ? `<div class="row"><button type="button" data-act="edit" data-i="${i}">تعديل</button><button type="button" class="warn" data-act="del" data-i="${i}">${armed===i ? "تأكيد الحذف" : "حذف"}</button></div>` : ""}
    </article>`).join("") : `<p class="empty">${T[lang].empty}</p>`;
}

function renderAdmin(){
  if(!admin){ $("admin").innerHTML = ""; return; }
  const cats = [...new Set(draft.map(p => p.cat).filter(Boolean))];
  $("admin").innerHTML = `<section class="panel"><h2>${editing>=0 ? "تعديل منتج" : "إضافة منتج"}</h2>
    <form id="form" autocomplete="off">
      <input id="fName" placeholder="اسم المنتج" required>
      <input id="fCat" list="cats" placeholder="القسم (مثلًا: حجابات)">
      <input id="fPrice" inputmode="numeric" placeholder="السعر (اختياري)">
      <button class="go" type="submit">${editing>=0 ? "حفظ" : "إضافة"}</button>
      <input id="fNameEn" dir="ltr" placeholder="Product name (English)">
      <input id="fCatEn" dir="ltr" placeholder="Category (English)">
      <div class="image-editor">
        <img id="imgPreview" class="preview" alt="معاينة صورة المنتج">
        <div class="image-tools">
          <label for="fImg">صورة المنتج (اختياري)</label>
          <input id="fImg" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <button type="button" data-act="rmimg">إزالة الصورة</button>
          <span id="imgState" class="hint">اختار صورة من جهازك، وهتظهر معاينتها هنا.</span>
        </div>
      </div>
    </form>
    <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <button class="pub" id="pubBtn" type="button" ${dirty ? "" : "disabled"}>تنزيل الصفحة المعدلة</button>
    <div class="status" id="status">${dirty ? "فيه تعديلات لسه متنزلتش." : "ضيف أو عدّل منتجات، وبعدها اضغط تنزيل الصفحة المعدلة وارفعها على الاستضافة مكان القديمة."}</div></section>`;
  if(editing >= 0){ const p = draft[editing]; $("fName").value = p.name; $("fCat").value = p.cat || ""; $("fPrice").value = p.price || ""; $("fNameEn").value = p.nameEn || ""; $("fCatEn").value = p.catEn || ""; formImg = p.img || ""; if(formImg && $("imgPreview")){ $("imgPreview").src = imgSrc(formImg); $("imgPreview").classList.add("visible"); $("imgState").textContent = "الصورة الحالية — تقدر تغيّرها أو تشيلها"; } } else formImg = "";
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.c !== undefined && b.closest("#filters")){ current = b.dataset.c; render(); return; }
  if(b.id === "adminBtn"){
    admin = !admin; editing = -1; armed = -1;
    b.textContent = admin ? "إخفاء التعديل" : "إظهار التعديل";
    renderAdmin(); render();
    if(!admin) $("editLink").hidden = false;
    return;
  }
  if(b.dataset.act === "edit"){ editing = +b.dataset.i; armed = -1; renderAdmin(); render(); $("admin").scrollIntoView({block:"nearest"}); return; }
  if(b.dataset.act === "del"){
    const i = +b.dataset.i;
    if(armed === i){ draft.splice(i,1); armed = -1; editing = -1; dirty = true; persist(); renderAdmin(); } else { armed = i; }
    render(); return;
  }
  if(b.dataset.act === "rmimg"){ formImg = ""; if($("fImg")) $("fImg").value = ""; if($("imgPreview")){ $("imgPreview").removeAttribute("src"); $("imgPreview").classList.remove("visible"); } if($("imgState")) $("imgState").textContent = "تمت إزالة الصورة"; return; }
  if(b.id === "editLink"){
    EDIT = true; admin = true; editing = -1; armed = -1;
    $("editLink").hidden = true;
    $("adminBar").innerHTML = `<button id="adminBtn" type="button">إخفاء التعديل</button>`;
    renderAdmin(); render();
    $("admin").scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(b.id === "langBtn"){ lang = lang === "ar" ? "en" : "ar"; applyLang(); return; }
  if(b.id === "pubBtn") publish();
});
document.addEventListener("submit", e => {
  if(e.target.id !== "form") return;
  e.preventDefault();
  const item = { name: $("fName").value.trim(), cat: $("fCat").value.trim(), price: $("fPrice").value.trim(), nameEn: $("fNameEn").value.trim(), catEn: $("fCatEn").value.trim(), img: formImg };
  if(!item.name) return;
  if(editing >= 0) draft[editing] = item; else draft.push(item);
  editing = -1; dirty = true; persist(); renderAdmin(); render();
});

document.addEventListener("change", async e => {
  if(e.target.id !== "fImg") return;
  const f = e.target.files[0]; if(!f) return;
  $("imgState").textContent = "جاري تجهيز الصورة…";
  try{
    if(f.size > 15 * 1024 * 1024) throw new Error("حجم الصورة أكبر من 15 ميجابايت");
    const blob = await shrink(f);
    const dataUrl = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error("تعذرت قراءة الصورة"));
      fr.readAsDataURL(blob);
    });
    formImg = dataUrl;
    $("imgPreview").src = dataUrl;
    $("imgPreview").classList.add("visible");
    $("imgState").textContent = "الصورة جاهزة ✓ اضغط إضافة أو حفظ لتثبيتها";
  }catch(err){
    $("imgState").textContent = (err && err.message) || "الصورة لم تُجهّز. جرّب صورة أخرى.";
    e.target.value = "";
  }
});

const KEY = "scarfi_draft";
let EDIT = false;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(draft)); }catch(e){} }
async function publish(){
  try{
    const c = document.documentElement.cloneNode(true);
    c.setAttribute("lang","ar"); c.setAttribute("dir","rtl");
    c.querySelector("#data").textContent = JSON.stringify({shop:S, products:draft}).replace(/</g,"\\u003c");
    ["grid","filters","admin","adminBar"].forEach(id => { c.querySelector("#"+id).innerHTML = ""; });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["<!DOCTYPE html>\n" + c.outerHTML], {type:"text/html"}));
    a.download = "index.html"; document.body.appendChild(a); a.click(); a.remove();
    try{ localStorage.removeItem(KEY); }catch(e){}
    dirty = false;
    $("status").textContent = "تم تنزيل index.html. ارفعه على الاستضافة مكان القديم.";
  }catch(err){ $("status").textContent = "التنزيل ماتمش. جرّب تاني."; }
}
applyLang();
</script>
</body>
</html>
